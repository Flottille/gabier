[package]
name = "gabier"
version = "0.1.0"
edition = "2021"
description = "Notifie sur Discord à chaque connexion SSH"
license = "MIT"
repository = "https://github.com/Flottille/gabier"
homepage = "https://gabier.sh"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "process", "time",
    "sync", "io-util", "io-std", "fs", "signal",
] }
# rustls plutot qu'OpenSSL: pas de dependance systeme a installer sur le VPS,
# et les racines sont embarquees (webpki-roots), ce qui va bien avec une unite
# systemd durcie.
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hostname = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
